services:
  postgres-bus:
    image: postgres:17
    container_name: postgres-bus
    environment:
      POSTGRES_DB: ${POSTGRES_DB_BUS}
      POSTGRES_USER: ${POSTGRES_BUS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_BUS}
    ports:
        - "127.0.0.1:${PORTS_BUS:-5433}:5432"
    volumes:
      - postgres_bus_data:/var/lib/postgresql/data
    networks:
      - network-volume-data

  user-db:
      image: postgres:17
      container_name: user-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${POSTGRES_DB_USER}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_USER}
      ports:
        - "127.0.0.1:${PORTS_USER:-5435}:5432"
      volumes:
        - user_db_data:/var/lib/postgresql/data
      networks:
        - network-volume-data


  bus-service:
    build:
      context: ./BusService
      dockerfile: ./Dockerfile
    container_name: myapp_bus_service
    restart: "no"
    ports:
      - "${PORTS_PUBLISH_BUS:-8081}:8081"
    environment:
      PORT_BUS: ${PORT_BUS}
      DB_HOST_BUS: ${DB_HOST_BUS}
      DB_PORT_BUS: ${DB_PORT_BUS}
      DB_NAME_BUS: ${DB_NAME_BUS}
      DB_PASSWORD_BUS: ${DB_PASSWORD_BUS}
      DB_USER_BUS: ${DB_USER_BUS}

    depends_on:
      - postgres-bus
    networks:
      - network-volume-data
      - public-network

  user-service:
    build:
      context: ./UserService
      dockerfile: ./Dockerfile
    container_name: myapp_user_service
    restart: "no"
    ports:
      - "${PORTS_PUBLISH_USER:-8091}:8091"
    environment:
      PORT_USER: ${PORT_USER}
      DB_HOST_USER: ${DB_HOST_USER}
      DB_PORT_USER: ${DB_PORT_USER}
      DB_NAME_USER: ${DB_NAME_USER}
      DB_PASSWORD_USER: ${DB_PASSWORD_USER}
      DB_USER_USER: ${DB_USER_USER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

    depends_on:
      - user-db

    networks:
      - network-volume-data
      - public-network


networks:
  #Red privada para las bases de datos.
  network-volume-data:
    driver: bridge
    internal: true

  #Red publica donde se comparten los servicios.
  public-network:
    driver: bridge


volumes:
  user_db_data:
  postgres_bus_data: