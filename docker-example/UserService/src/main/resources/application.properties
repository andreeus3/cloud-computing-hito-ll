spring.application.name=UserService
server.port=${PORT_USER:8091}

spring.datasource.url=jdbc:postgresql://${DB_HOST_USER:localhost}:${DB_PORT_USER:5435}/${DB_NAME_USER:user_db}
spring.datasource.username=${DB_USER_USER:user_admin}
spring.datasource.password=${DB_PASSWORD_USER:user_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

