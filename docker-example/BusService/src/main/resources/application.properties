spring.application.name=BusService
server.port=${PORT_BUS:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST_BUS:localhost}:${DB_PORT_BUS:5433}/${DB_NAME_BUS:bus_db}
spring.datasource.username=${DB_USER_BUS:bus_user}
spring.datasource.password=${DB_PASSWORD_BUS:bus_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true