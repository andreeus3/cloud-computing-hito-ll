name: CI - UserService

on:
  push:
    branches:
      - '**'
    paths:
      - 'docker-example/UserService/**'
      - '.github/workflows/user-service-ci.yml'

  pull_request:
    branches:
      - '**'
    paths:
      - 'docker-example/UserService/**'
      - '.github/workflows/user-service-ci.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker-example/UserService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: docker-example/UserService/pom.xml

      - name: Run unit tests
        run: mvn -B test